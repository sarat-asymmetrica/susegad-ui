<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolam scene</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>
  body { margin: 0; background: var(--sg-surface, Canvas); color: var(--sg-text, CanvasText); font: 16px/1.5 var(--sg-font-body, system-ui, sans-serif); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .lede { margin: 0 0 20px; color: var(--sg-text-soft, inherit); }
  sg-scene { border-radius: 6px; }
  sg-scene h2 { margin: 0 0 4px; font-size: 1.25rem; }
  sg-scene p { margin: 0; }
  form { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 20px; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 12px; }
  legend { font-weight: 600; float: left; margin-right: 8px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sg-focus, Highlight); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kolam</h1>
  <p class="lede">One line of rice flour around a grid of dots. A dev page for the scene and for sg-scene.</p>
  <sg-scene id="kolam" name="kolam">
    <h2>The door is open</h2>
    <p>Three rooms above the paddy, a short walk from the river.</p>
  </sg-scene>
  <form id="controls">
    <fieldset>
      <legend>Register</legend>
      <label><input type="radio" name="register" value="quiet"> Quiet</label>
      <label><input type="radio" name="register" value="warm"> Warm</label>
      <label><input type="radio" name="register" value="playful"> Playful</label>
    </fieldset>
    <label><input type="checkbox" id="dark"> Dark</label>
    <label><input type="checkbox" id="useProgress"> Show progress</label>
    <label for="progress">Progress</label>
    <input type="range" id="progress" min="0" max="1" step="0.01" value="0.4" disabled>
    <button type="button" id="replay">Draw again</button>
    <button type="button" id="reseed">New kolam</button>
  </form>
</main>
<script type="module">
  const q = new URLSearchParams(location.search), root = document.documentElement;
  const el = document.getElementById('kolam');
  const register = q.get('register') || 'warm';
  root.dataset.register = register;
  if (q.get('theme')) root.dataset.theme = q.get('theme');
  for (const k of ['seed', 'progress', 'grid', 'palette']) if (q.has(k)) el.setAttribute(k, q.get(k));
  el.addEventListener('sg-ready', () => { window.__ready = true; }, { once: true });
  window.__piece = el;
  await import('./index.js');

  const form = document.getElementById('controls'), dark = document.getElementById('dark');
  const use = document.getElementById('useProgress'), range = document.getElementById('progress');
  form.register.value = register;
  dark.checked = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  use.checked = el.hasAttribute('progress');
  range.disabled = !use.checked;
  if (use.checked) range.value = el.getAttribute('progress');
  form.addEventListener('change', e => {
    if (e.target.name === 'register') root.dataset.register = form.register.value;
    if (e.target === dark) root.dataset.theme = dark.checked ? 'dark' : 'light';
    if (e.target === use) { range.disabled = !use.checked; use.checked ? el.setAttribute('progress', range.value) : el.removeAttribute('progress'); }
  });
  range.addEventListener('input', () => el.setAttribute('progress', range.value));
  document.getElementById('replay').onclick = () => el.replay();
  document.getElementById('reseed').onclick = () => el.reseed();
</script>
</body>
</html>
