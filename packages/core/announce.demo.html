<!doctype html>
<html lang="en-IN">
<head>
<script src="/tools/harness/demo.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcing a total</title>
<style>
  body { margin: 0; background: var(--sg-surface); color: var(--sg-text); font: var(--sg-step-0) / var(--sg-leading-body) var(--sg-font-body); }
  main { max-width: 36rem; margin: 0 auto; padding: var(--sg-space-5) 16px var(--sg-space-6); }
  h1 { font: 400 var(--sg-step-4) / var(--sg-leading-tight) var(--sg-font-display); margin: 0 0 var(--sg-space-2); }
  .lede { margin: 0 0 var(--sg-space-4); max-width: var(--sg-measure); color: var(--sg-text-soft); }
  .row { display: flex; align-items: center; gap: var(--sg-space-3); margin: 0 0 var(--sg-space-3); }
  .count { min-width: 3ch; text-align: center; font-variant-numeric: tabular-nums; font: 400 var(--sg-step-2) var(--sg-font-display); }
  button { min-width: 44px; min-height: 44px; padding: 0 var(--sg-space-3); font: inherit; color: var(--sg-text); background: var(--sg-surface-raised); border: 1px solid var(--sg-border); border-radius: var(--sg-radius-2); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sg-accent); outline-offset: 2px; }
  .total { margin: 0 0 var(--sg-space-4); font-weight: 600; }
  dialog { max-width: 28rem; padding: var(--sg-space-4); color: var(--sg-text); background: var(--sg-surface-raised); border: 1px solid var(--sg-border); border-radius: var(--sg-radius-3); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
</style>
</head>
<body>
<main>
  <h1>Supper club</h1>
  <p class="lede">The total is plain text on the page. When it changes, the page also says it aloud once, however fast the buttons are pressed.</p>

  <div class="row" role="group" aria-labelledby="who">
    <span id="who">People</span>
    <button type="button" id="less" aria-label="One fewer person">−</button>
    <output id="n" class="count" for="less more">2</output>
    <button type="button" id="more" aria-label="One more person">+</button>
  </div>
  <p class="total" id="total">2 people, ₹3,000</p>

  <p class="row">
    <button type="button" id="open">Add guests in a dialog</button>
    <button type="button" id="taken">Pretend the slot went</button>
  </p>

  <dialog id="dlg" aria-labelledby="dlgh">
    <h2 id="dlgh">More guests</h2>
    <div class="row" role="group" aria-labelledby="dwho">
      <span id="dwho">Extra people</span>
      <button type="button" id="dless" aria-label="One fewer extra person">−</button>
      <output id="dn" class="count">0</output>
      <button type="button" id="dmore" aria-label="One more extra person">+</button>
    </div>
    <p class="total" id="dtotal">No extra people</p>
    <button type="button" id="close">Done</button>
  </dialog>
</main>
<script type="module">
  import { announce } from '/packages/core/announce.js';
  import { rupees } from '/packages/core/intl.core.js';
  const PRICE = 1500;
  const $ = id => document.getElementById(id);
  const line = n => `${n} ${n === 1 ? 'person' : 'people'}, ${rupees(n * PRICE)}`;
  let n = 2, extra = 0;
  const set = (d) => {
    n = Math.min(20, Math.max(1, n + d));
    $('n').textContent = n; $('total').textContent = line(n);
    announce(line(n), { from: $('more') });
  };
  $('less').onclick = () => set(-1);
  $('more').onclick = () => set(1);
  $('taken').onclick = () => announce('That slot was just taken. Pick another.', { priority: 'assertive', from: $('taken') });
  $('open').onclick = () => $('dlg').showModal();
  $('close').onclick = () => $('dlg').close();
  const more = d => {
    extra = Math.min(10, Math.max(0, extra + d));
    $('dn').textContent = extra;
    const t = extra ? `${extra} extra, ${rupees(extra * PRICE)}` : 'No extra people';
    $('dtotal').textContent = t;
    announce(t, { from: $('dmore') });
  };
  $('dless').onclick = () => more(-1);
  $('dmore').onclick = () => more(1);
  window.__demoReady();
</script>
</body>
</html>
