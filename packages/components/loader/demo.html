<!doctype html>
<html lang="en">
<head>
<script src="/tools/harness/demo.js"></script>
<link rel="stylesheet" href="/packages/tokens/fonts.css">
<link rel="stylesheet" href="/packages/tokens/tokens.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title>
<link rel="stylesheet" href="./loader.css">
<style>
  body { margin: 0; background: var(--sg-surface, Canvas); color: var(--sg-text, CanvasText); font: var(--sg-step-0, 1rem)/1.5 var(--sg-font-body, system-ui, sans-serif); }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem 3rem; display: grid; gap: 1.75rem; }
  h1 { margin: 0; font: 600 1.6rem/1.2 var(--sg-font-display, inherit); }
  h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--sg-text-soft, inherit); font-weight: 600; }
  section { display: grid; gap: 1rem; justify-items: start; }
  .card { border: 1px solid var(--sg-rule, GrayText); border-radius: var(--sg-radius-2, 6px); padding: 1.25rem; min-block-size: 6rem; display: grid; place-items: center; justify-self: stretch; }
  button { font: inherit; padding: 0.4rem 0.9rem; border-radius: var(--sg-radius-2, 6px); border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sg-focus, Highlight); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Loader</h1>
  <section aria-labelledby="h-words">
    <h2 id="h-words">With the page's words</h2>
    <sg-loader label="Loading your bookings"></sg-loader>
    <sg-loader>Checking the calendar for 14 to 18 October</sg-loader>
  </section>
  <section aria-labelledby="h-default">
    <h2 id="h-default">With the register's own words</h2>
    <sg-loader></sg-loader>
  </section>
  <section aria-labelledby="h-card">
    <h2 id="h-card">In place of content</h2>
    <div class="card"><sg-loader label="Fetching this month's invoices"></sg-loader></div>
  </section>
  <section aria-labelledby="h-change">
    <h2 id="h-change">Words that change are read out</h2>
    <sg-loader id="stage" label="Sending your photos"></sg-loader>
    <button type="button" id="next">Move to the next step</button>
  </section>
</main>
<script type="module">
  import './loader.js';
  const steps = ['Sending your photos', 'Making previews', 'Saving the album'];
  let i = 0;
  const stage = document.getElementById('stage');
  document.getElementById('next').addEventListener('click', () => { i = (i + 1) % steps.length; stage.setAttribute('label', steps[i]); });
</script>
</body>
</html>
