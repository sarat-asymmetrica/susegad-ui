<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke fixture: partial</title>
</head>
<body>
<main>
<h1>Smoke fixture: partial</h1>
<p>Two scenes: one announces sg-ready, the other never does.</p>
<sg-scene id="a" name="painted" style="display:block;height:40px"></sg-scene>
<sg-scene id="b" name="blank" style="display:block;height:40px"></sg-scene>
<script>document.getElementById("a").dispatchEvent(new CustomEvent("sg-ready", { bubbles: true, composed: true }));</script>
</main>
</body>
</html>
