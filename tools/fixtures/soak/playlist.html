<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soak host: playlist</title>
<!-- The playlist host for tools/soak.mjs --playlist: one full-viewport iframe, replaced (removed, then a new one made) every
     ?dwell seconds with the next ?s= path, so a scene that does not clean up on unmount shows as growth across mounts.
     window.__playlist counts mounts and unmounts. Same origin, so the tool can reach into the frame to count canvases. -->
<style>html, body { margin: 0; height: 100%; background: #111 } iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0 }</style>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const list = q.getAll('s');
  const dwell = Math.max(1, Number(q.get('dwell')) || 20) * 1000;
  let i = -1, frame = null;
  window.__playlist = { mounts: 0, unmounts: 0, current: null };
  function next() {
    if (frame) { frame.remove(); frame = null; window.__playlist.unmounts++; }
    i = (i + 1) % list.length;
    frame = document.createElement('iframe');
    frame.src = list[i];
    document.body.append(frame);
    window.__playlist.mounts++;
    window.__playlist.current = list[i];
  }
  next();
  setInterval(next, dwell);
  window.__ready = true;
</script>
