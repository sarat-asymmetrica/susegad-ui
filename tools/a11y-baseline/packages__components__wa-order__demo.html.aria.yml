  - button "Start again" [disabled]
  - heading "Your order" [level=2]
  - group "Your details":
    - textbox "Day you want it"
    - combobox "Time of day":
      - option "No preference" [selected]
      - option "Morning (9 to 12)"
      - option "Afternoon (12 to 4)"
      - option "Evening (4 to 7)"
