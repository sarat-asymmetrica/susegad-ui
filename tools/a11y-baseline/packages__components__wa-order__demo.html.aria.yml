- main:
  - heading "WhatsApp order" [level=1]
  - paragraph
  - heading "The menu" [level=2]
  - heading "Fresh pasta" [level=3]
  - list:
    - listitem:
      - list:
        - listitem
        - listitem
      - group "Fresh fettuccine, quantity":
        - button "Remove one Fresh fettuccine" [disabled]
        - button "Add one Fresh fettuccine"
    - listitem:
      - list:
        - listitem
      - group "Spinach ravioli, quantity":
        - button "Remove one Spinach ravioli" [disabled]
        - button "Add one Spinach ravioli"
    - listitem:
      - list:
        - listitem
        - listitem
      - group "Beetroot gnocchi, quantity":
        - button "Remove one Beetroot gnocchi" [disabled]
        - button "Add one Beetroot gnocchi"
  - heading "Sauces" [level=3]
  - list:
    - listitem:
      - list:
        - listitem
        - listitem
      - group "Tomato and basil, quantity":
        - button "Remove one Tomato and basil" [disabled]
        - button "Add one Tomato and basil"
    - listitem:
      - list:
        - listitem
        - listitem
      - group "Walnut pesto, quantity":
        - button "Remove one Walnut pesto" [disabled]
        - button "Add one Walnut pesto"
