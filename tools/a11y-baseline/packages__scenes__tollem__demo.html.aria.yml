  - slider "Swell": "0.5"
  - checkbox "Show progress"
  - slider "Progress" [disabled]: "0.4"
  - combobox "Palette":
    - option "seed" [selected]
    - option "aqua"
    - option "sky"
    - option "celadon"
  - combobox "Renderer":
    - option "auto" [selected]
    - option "webgl"
    - option "2d"
  - button "Lose the WebGL context"
  - button "Start again"
  - button "New pool"
