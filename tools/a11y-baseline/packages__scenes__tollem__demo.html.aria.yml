- main:
  - heading "Tollem" [level=1]
  - paragraph
  - img "Looking down into a pool at noon: pale tiles under a moving net of light, a laterite edge, and a frangipani flower afloat."
  - heading "Swim before lunch" [level=2]
  - paragraph
  - button "Pause animation"
  - status
  - paragraph
  - group "Register":
    - radio "Quiet"
    - radio "Warm" [checked]
    - radio "Playful"
  - checkbox "Dark"
